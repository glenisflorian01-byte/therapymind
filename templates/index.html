<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TherapyMind - Iniciar Sesión</title>
  <!--<link rel="stylesheet" href="css/styles.css" />-->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <h1>🧠 TherapyMind</h1>
        <p>Tu bienestar mental, nuestra prioridad</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required placeholder="tu@email.com"/>
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••"/>
        </div>
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
        <p class="error" id="loginError"></p>
      </form>

      <div class="auth-footer">
        <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate como paciente</a></p>
      </div>

      <form id="registerForm" style="display:none;">
        <h3>Registro de Paciente</h3>
        <div class="input-group">
          <label>Nombre completo</label>
          <input type="text" id="regName" required />
        </div>
        <div class="input-group">
          <label>Correo</label>
          <input type="email" id="regEmail" required />
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="regPassword" required minlength="6"/>
        </div>
        <div class="input-group">
          <label>Teléfono</label>
          <input type="tel" id="regPhone" />
        </div>
        <button type="submit" class="btn-primary">Registrarme</button>
        <p class="link-back"><a href="#" id="backToLogin">← Volver al login</a></p>
      </form>
    </div>
  </div>

  <!--script src="js/data.js"></script>
  <script src="js/auth.js"></script-->
    <script src="{{ url_for('static', filename='js/data.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
