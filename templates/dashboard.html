<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TherapyMind - Dashboard</title>
  <!--link rel="stylesheet" href="css/styles.css"/-->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">🧠 TherapyMind</div>
      <nav id="navMenu"></nav>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h2 id="pageTitle">Panel Principal</h2>
        <div class="user-info">
          <div class="avatar" id="avatar">A</div>
          <div>
            <div id="userName" style="font-weight:700"></div>
            <div id="userRole" style="font-size:0.8rem;color:#64748b"></div>
          </div>
          <button class="btn-logout" id="logoutBtn">Salir</button>
        </div>
      </div>

      <div class="stats-grid" id="statsGrid"></div>
      <div class="card" id="mainCard"></div>
    </main>
  </div>

  <!-- MODAL CITA -->
  <div class="modal" id="citaModal">
    <div class="modal-content">
      <h3 id="citaModalTitle">Nueva Cita</h3>
      <form id="citaForm">
        <input type="hidden" id="citaId"/>
        <div class="input-group">
          <label>Paciente</label>
          <select id="citaPaciente" required></select>
        </div>
        <div class="input-group">
          <label>Psicólogo</label>
          <select id="citaPsico" required></select>
        </div>
        <div class="input-group">
          <label>Fecha</label>
          <input type="date" id="citaFecha" required/>
        </div>
        <div class="input-group">
          <label>Hora</label>
          <input type="time" id="citaHora" required/>
        </div>
        <div class="input-group">
          <label>Motivo</label>
          <input type="text" id="citaMotivo" required/>
        </div>
        <div class="input-group">
          <label>Estado</label>
          <select id="citaEstado">
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelCitaBtn">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL USUARIO -->
  <div class="modal" id="userModal">
    <div class="modal-content">
      <h3 id="userModalTitle">Nuevo Usuario</h3>
      <form id="userForm">
        <input type="hidden" id="userId"/>
        <div class="input-group">
          <label>Nombre completo</label>
          <input type="text" id="uNombre" required/>
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="uEmail" required/>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="uPassword" required minlength="6"/>
        </div>
        <div class="input-group">
          <label>Teléfono</label>
          <input type="tel" id="uTelefono"/>
        </div>
        <div class="input-group">
          <label>Rol</label>
          <select id="uRol">
            <option value="paciente">Paciente</option>
            <option value="psicologo">Psicólogo</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="input-group">
          <label>Especialidad (solo psicólogos)</label>
          <input type="text" id="uEspecialidad"/>
        </div>
        <div class="input-group">
          <label>Psicólogo asignado (solo pacientes)</label>
          <select id="uPsicologoId"></select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelUserBtn">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL SEGUIMIENTO -->
  <div class="modal" id="segModal">
    <div class="modal-content">
      <h3>Nuevo Seguimiento</h3>
      <form id="segForm">
        <div class="input-group">
          <label>Paciente</label>
          <select id="sPaciente" required></select>
        </div>
        <div class="input-group">
          <label>Fecha</label>
          <input type="date" id="sFecha" required/>
        </div>
        <div class="input-group">
          <label>Observación</label>
          <textarea id="sObservacion" required rows="4" style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;"></textarea>
        </div>
        <div class="input-group">
          <label>Estado</label>
          <select id="sEstado">
            <option value="estable">Estable</option>
            <option value="en observación">En observación</option>
            <option value="crítico">Crítico</option>
            <option value="mejoría">Mejoría</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelSegBtn">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!--script src="js/data.js"></script>
  <script src="js/app.js"></script-->
    <script src="{{ url_for('static', filename='js/data.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
